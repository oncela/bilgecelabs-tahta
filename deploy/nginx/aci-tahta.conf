# Acı Tahta paneli. Dışarıya Cloudflare Tunnel ile açılır (tahta.bilgecelabs.com),
# bu yüzden sadece yerel adreste dinler.
server {
    listen 127.0.0.1:8082;
    server_name _;
    root /var/www/aci-tahta/public;
    index index.php;
    absolute_redirect off;
    client_max_body_size 64m;
    access_log /var/log/nginx/aci-tahta.access.log;
    error_log  /var/log/nginx/aci-tahta.error.log;

    # Güvenlik başlıkları (panel MeshCentral'ı kendi içinde çerçeveler)
    add_header X-Content-Type-Options nosniff always;
    # Uzaktan erişim çerçevesi panelin adresini (yalnız alan adı) bilmeli: köprü bunu doğrular
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ /\. { deny all; return 404; }

    # Kısa bağlantılar (giriş gerektirmez): yalnız yönlendirir, dosya bu sunucudan verilmez.
    # Bitdefender GravityZone kurulum paketi: dosya adındaki [..] kısmı şirket hesabını
    # belirtir, yönlendirmeyle orijinal adıyla iner.
    location = /bitdefender {
        return 302 "https://cloudgz.gravityzone.bitdefender.com/Packages/BSTWIN/0/setupdownloader_[aHR0cHM6Ly9jbG91ZGd6LWVjcy5ncmF2aXR5em9uZS5iaXRkZWZlbmRlci5jb20vUGFja2FnZXMvQlNUV0lOLzAvUS1Lc0lnL2luc3RhbGxlci54bWw-bGFuZz1lbi1VUw==].exe";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # fastcgi-php.conf kendi try_files kuralını içerir (olmayan .php -> 404)
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm-aci-tahta.sock;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_read_timeout 120s;
    }

    # Tabler ve tema dosyaları: sürüm parametresiyle önbellek kırılır
    location ^~ /vendor/ { expires 30d; add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location ^~ /assets/ { expires 7d; try_files $uri =404; }
}
