# Acı Tahta paneli. Dışarıya Cloudflare Tunnel ile açılır (tahta.bilgecelabs.com),
# bu yüzden sadece yerel adreste dinler.
server {
    listen 127.0.0.1:8082;
    server_name _;
    root /var/www/aci-tahta/public;
    index index.php;
    absolute_redirect off;
    client_max_body_size 64m;
    access_log /var/log/nginx/aci-tahta.access.log;
    error_log  /var/log/nginx/aci-tahta.error.log;

    # Güvenlik başlıkları (panel MeshCentral'ı kendi içinde çerçeveler)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ /\. { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # fastcgi-php.conf kendi try_files kuralını içerir (olmayan .php -> 404)
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm-aci-tahta.sock;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_read_timeout 120s;
    }

    # Tabler ve tema dosyaları: sürüm parametresiyle önbellek kırılır
    location ^~ /vendor/ { expires 30d; add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location ^~ /assets/ { expires 7d; try_files $uri =404; }
}
