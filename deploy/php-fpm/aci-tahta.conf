; Acı Tahta paneli: ayrı kullanıcı ve ayrı havuz (diğer sitelerden yalıtılmış)
[aci-tahta]
user = aci-tahta
group = aci-tahta
listen = /run/php/php8.1-fpm-aci-tahta.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; Sunucu belleği küçük: istek geldikçe süreç aç, boşta kapat
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 128M
php_admin_value[expose_php] = Off
php_admin_value[session.save_path] = /var/lib/aci-tahta/sessions
php_admin_value[error_log] = /var/log/aci-tahta/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
