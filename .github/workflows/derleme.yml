# Acı Tahta: ajanı Windows üzerinde derler, sınar ve sürüm yayımlar.
# - Her push / PR: derleme + go vet + PHP sözdizimi + exe'nin Windows'ta açılış testi
# - "v*" etiketi (ör. v0.2.0): ayrıca GitHub Releases'e exe ve sha256 yüklenir
# İmzalama: SIGN_CERT_PFX_BASE64 ve SIGN_CERT_PASSWORD gizli değişkenleri tanımlanınca çalışır.
name: derleme

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  ajan:
    runs-on: windows-latest
    env:
      # Adım koşulunda gizli değişken doğrudan okunamaz; iş seviyesinde işaretle.
      HAS_SIGN_CERT: ${{ secrets.SIGN_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Sürüm
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Kaynak (sürüm bilgisi, manifest)
        working-directory: agent/cmd/aci-ajan
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --arch amd64 --product-version "$env:VERSION.0" --file-version "$env:VERSION.0"

      - name: Self servis penceresi (ajan içine gömülür)
        working-directory: agent
        run: |
          Push-Location cmd/bilgece-destek
          go-winres make --arch amd64 --product-version "$env:VERSION.0" --file-version "$env:VERSION.0"
          Pop-Location
          go build -trimpath -ldflags "-H windowsgui -X main.version=$env:VERSION" -o cmd/aci-ajan/assets/bilgece-destek.exe ./cmd/bilgece-destek

      - name: Kontrol
        working-directory: agent
        run: go vet ./...

      - name: Derle
        working-directory: agent
        run: go build -trimpath -ldflags "-H windowsgui -X main.version=$env:VERSION" -o build/bilgece-tahta.exe ./cmd/aci-ajan

      - name: Açılış testi (Windows)
        working-directory: agent
        shell: pwsh
        run: |
          $out = & .\build\bilgece-tahta.exe version
          if ($out.Trim() -ne $env:VERSION) { throw "beklenen $env:VERSION, gelen $out" }
          "sürüm: $out"

      - name: İmzala (sertifika tanımlıysa)
        if: env.HAS_SIGN_CERT == 'true'
        env:
          SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'imza.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_CERT_PASSWORD agent\build\bilgece-tahta.exe
          Remove-Item $pfx

      - name: Özet
        shell: pwsh
        run: |
          $h = (Get-FileHash agent\build\bilgece-tahta.exe -Algorithm SHA256).Hash.ToLower()
          "$h  bilgece-tahta.exe" | Out-File agent\build\bilgece-tahta.exe.sha256 -Encoding ascii
          "sha256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: bilgece-tahta-${{ env.VERSION }}
          path: |
            agent/build/bilgece-tahta.exe
            agent/build/bilgece-tahta.exe.sha256

      - name: Sürüm yayımla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/build/bilgece-tahta.exe
            agent/build/bilgece-tahta.exe.sha256

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - name: PHP sözdizimi
        run: find panel -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS sözdizimi
        run: node --check panel/public/assets/app.js
      - name: Kurulum betiği sözdizimi
        run: bash -n deploy/install.sh && bash -n panel/tests/smoke.sh
